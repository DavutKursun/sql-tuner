name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Kaggle keeps its preinstalled transformers (5.16.1 in M2: it satisfies >=4.57, so pip does not upgrade it), and
        # its logits_to_keep takes only an int or a 1D index; 4.57.1 is the floor requirements-train allows
        transformers: ["latest", "5.16.1", "4.57.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - if: matrix.transformers != 'latest'
        run: pip install "transformers==${{ matrix.transformers }}"
      - run: pytest -q
